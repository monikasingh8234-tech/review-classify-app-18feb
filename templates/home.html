<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Classifier App</title>

<style>

*{
    box-sizing:border-box;
    font-family: Cambria, serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#dff6ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    width:90%;
    max-width:450px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    margin-bottom:20px;
    color:#222;
}

/* File input */

input[type=file]{
    width:100%;
    padding:10px;
    border:1px dashed #999;
    border-radius:8px;
    cursor:pointer;
}

/* Button */

input[type=submit]{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

input[type=submit]:hover{
    background:#1e40af;
}

/* Result */

.result{
    margin-top:20px;
    padding:10px;
    background:#f0f9ff;
    border-radius:8px;
    color:#0f172a;
    font-weight:bold;
}

/* Mobile */

@media(max-width:500px){
    h1{font-size:22px;}
}

</style>

</head>

<body>

<div class="container">

<h1>Review Classifier</h1>

<form method="POST" enctype="multipart/form-data">

<input type="file" name="file" required>

<input type="submit" value="Upload & Classify">

</form>

<div class="result">
{{ msg }}
</div>

</div>

</body>
</html>
